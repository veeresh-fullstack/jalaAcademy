<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${employee.id == null} ? 'Add Employee' : 'Edit Employee'"></title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f7f9fc;
            margin: 0;
            padding: 20px;
        }

        h1 {
            text-align: center;
            color: #333;
        }

        .form-container {
            width: 400px;
            margin: 0 auto;
            background-color: #fff;
            padding: 25px;
            border-radius: 6px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.1);
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: bold;
            color: #555;
        }

        input[type="text"] {
            width: 100%;
            padding: 8px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 10px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background-color: #45a049;
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 15px;
            text-decoration: none;
            color: #007BFF;
        }

        .back-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

<h1 th:text="${employee.id == null} ? 'Add Employee' : 'Edit Employee'"></h1>

<div class="form-container">
    <form th:action="@{/employees}" th:object="${employee}" method="post">
        <!-- Hidden field for ID -->
        <input type="hidden" th:field="*{id}">

        <!-- Name -->
        <label for="name">Name</label>
        <input type="text" th:field="*{name}" id="name" placeholder="Enter name"/>

        <!-- Department -->
        <label for="department">Department</label>
        <input type="text" th:field="*{department}" id="department" placeholder="Enter department"/>

        <label for="company">Company</label>
        <input type="text" th:field="*{company}" id="company" placeholder="Enter company"/>

        <!-- Save Button -->
        <button type="submit">Save</button>
    </form>

    <!-- Back to list -->
    <a href="/employees" class="back-link">← Back to Employee List</a>
</div>

</body>
</html>
